name: Deploy Interviq to AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy to AWS
        run: |
          cd ~/interviq

          git fetch origin main
          git reset --hard origin/main

          cd frontend
          npm install
          npm run build
          sudo cp -r dist/. /var/www/interviq/

          cd ../backend
          npm install
          pm2 restart interviq
